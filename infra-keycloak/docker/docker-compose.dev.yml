# Локальный стенд для проверки korzinka-auth-provider SPI без
# rebuild+push+deploy на ECS.
#
# Запуск:
#   docker compose -f docker-compose.dev.yml up --build -d
#   ./dev/bootstrap-realm.sh


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"

  keycloak:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      # aws-advanced-jdbc-wrapper проксирует обычный postgresql-драйвер, если
      # не настроен IAM-плагин — для локального теста просто статический пароль.
      KC_DB_URL: jdbc:aws-wrapper:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "18080:8080"
    command: ["start", "--optimized", "--http-port=8080"]
